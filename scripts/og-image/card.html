<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>Rafic by Sutur</title>
  <style>
    @font-face {
      font-family: Montserrat;
      src: url('../../src/app/fonts/montserrat-latin.woff2') format('woff2');
      font-style: normal;
      font-weight: 100 900;
      font-display: block;
    }
    @font-face {
      font-family: Inter;
      src: url('../../src/app/fonts/inter-latin.woff2') format('woff2');
      font-style: normal;
      font-weight: 100 900;
      font-display: block;
    }
    :root {
      --deep: #3b1447;
      --deep-3: #2a0d33;
      --soft: #ead1e5;
      --orange: #f57e20;
    }
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      isolation: isolate;
      background: linear-gradient(125deg, var(--deep), var(--deep-3));
      color: #fff;
      font-family: Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: absolute;
      z-index: -1;
      inset: -120px -160px -210px -180px;
      background:
        radial-gradient(closest-side, rgba(144,111,177,.45), transparent 70%) 0 100% / 75% 85% no-repeat,
        radial-gradient(closest-side, rgba(245,126,32,.2), transparent 70%) 100% 30% / 55% 75% no-repeat;
      filter: blur(50px);
    }
    main { position: absolute; top: 52px; left: 56px; width: 552px; }
    .wordmark { display: block; width: 194px; height: auto; }
    h1 {
      margin: 42px 0 26px;
      font-family: Montserrat, sans-serif;
      font-size: 60px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -.03em;
    }
    h1 em { display: block; font-style: normal; color: rgba(234,209,229,.6); }
    .nowrap { white-space: nowrap; }
    .dot {
      display: inline-block;
      width: .15em;
      height: .15em;
      margin-left: .05em;
      background: var(--orange);
      color: transparent;
      overflow: hidden;
      line-height: 0;
      vertical-align: baseline;
    }
    p { margin: 0; max-width: 525px; font-size: 23px; line-height: 1.45; color: rgba(234,209,229,.82); }
    .replica {
      position: absolute;
      left: 640px;
      top: 104px;
      width: 610px;
      height: 560px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 24px;
      background: #fff;
      box-shadow: inset 0 1px 0 #fff, 0 40px 90px -30px rgba(0,0,0,.65);
    }
    .replica img {
      position: absolute;
      width: 847.2px;
      height: 657.6px;
      max-width: none;
      left: -254px;
      top: -38px;
    }
    .replica::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 42px;
      height: 26px;
      background: #fff;
    }
  </style>
</head>
<body>
  <main>
    <img class="wordmark" src="../../public/brand/sutur-wordmark-soft.webp" width="265" height="96" alt="Sutur">
    <h1>Rafic does<br>the <span class="nowrap">work<span class="dot">.</span></span> <em>You approve<br>what <span class="nowrap">matters<span class="dot">.</span></span></em></h1>
    <p>The AI assistant that works in your apps, on your computer and while you're away.</p>
  </main>
  <div class="replica">
    <img src="replica.png" width="1412" height="1096" alt="Rafic's overdue invoices answer and approval card">
  </div>
</body>
</html>
